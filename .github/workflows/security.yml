name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC

permissions:
  contents: read
  security-events: write  # required to upload SARIF to code scanning

jobs:
  bbharden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run BlackByte Hardener (self-scan)
        run: |
          python3 -m bbharden.cli scan . \
            --format sarif --output bbharden.sarif \
            --skip security-files --exclude examples || true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bbharden.sarif

      - name: Gate on high+ findings
        run: python3 -m bbharden.cli scan . --exclude examples --format console --fail-on high
